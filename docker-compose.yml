# Les deux bases du projet, telles que decrites dans docs/architecture_etape2.pdf
#
#   TimescaleDB (PostgreSQL) : couche exploitable, les bougies nettoyees
#   MongoDB                  : couche brute, les reponses API telles quelles
#
# Demarrage :  docker compose up -d
# Arret      :  docker compose down            (les donnees survivent)
# Remise a zero : docker compose down -v       (supprime les volumes)

services:

  postgres:
    # Image TimescaleDB : c'est un PostgreSQL complet avec l'extension deja
    # installee. On garde donc psycopg2, psql et tout l'ecosysteme habituel.
    image: timescale/timescaledb:latest-pg16
    container_name: crypto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cryptobot}
      POSTGRES_USER: ${POSTGRES_USER:-cryptobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptobot}
      # Fuseau force a UTC : toutes nos donnees sont en UTC depuis l'etape 1,
      # un serveur en heure de Paris decalerait les horodatages a l'affichage.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Tout script place ici est execute UNE SEULE FOIS, a la creation du
      # volume. Pour les rejouer, il faut `docker compose down -v`.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Le pipeline attend que la base reponde vraiment avant d'ecrire.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cryptobot} -d ${POSTGRES_DB:-cryptobot}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  mongo:
    image: mongo:7
    container_name: crypto_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-cryptobot}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-cryptobot}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-cryptobot}
      TZ: UTC
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------------------
  #  Interfaces web d'exploration
  #
  #  Elles ne servent QU'A REGARDER les donnees : aucun script du projet n'en
  #  depend, le pipeline fonctionne sans elles. Elles sont pratiques pour une
  #  demonstration ou une capture d'ecran.
  #
  #  Les deux n'ecoutent que sur la machine locale, avec les identifiants de
  #  developpement. Sur un vrai serveur, il faudrait une authentification.
  # ---------------------------------------------------------------------------

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crypto_pgadmin
    restart: unless-stopped
    environment:
      # Identifiant de connexion, jamais utilise pour envoyer un courriel.
      # Le domaine doit exister (pgAdmin refuse .local, .test et compagnie).
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cryptobot.fr}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-cryptobot}
      # Mode bureau : ni ecran de connexion, ni mot de passe maitre. On arrive
      # directement sur la base, ce qui evite deux clics avant chaque capture.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Serveur deja enregistre : voir docker/pgadmin/servers.json
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  mongo-express:
    image: mongo-express:1.0.2
    container_name: crypto_mongo_express
    restart: unless-stopped
    environment:
      # `mongo` est le nom du service : les conteneurs se parlent par ce nom,
      # pas par localhost, qui designerait le conteneur lui-meme.
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-cryptobot}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-cryptobot}
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      # Pas de seconde authentification par-dessus : interface locale seulement.
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  # Volumes nommes : les donnees survivent a un `docker compose down`.
  postgres_data:
  mongo_data:
  # Preferences de pgAdmin (serveurs enregistres, mise en page).
  pgadmin_data:
