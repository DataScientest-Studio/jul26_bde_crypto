# Transmission d'une requete a l'API.
#
# Le chemin est transmis TEL QUEL (/api/graphique/...) : l'API connait son
# prefixe (CRYPTOBOT_PREFIXE=/api) et le retire elle-meme. C'est ce qui permet
# a sa documentation /api/docs de retrouver /api/openapi.json.
proxy_pass http://api_cryptobot;
proxy_http_version 1.1;
proxy_set_header Connection "";

# La cle de l'interface, ajoutee ici et jamais envoyee au navigateur.
# proxy_set_header REMPLACE l'en-tete : une cle envoyee par le client
# lui-meme est ignoree.
proxy_set_header X-API-Key "${CRYPTOBOT_CLE_INTERFACE}";

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Une annee de bougies 15 min se lit en plusieurs lots aupres de Binance.
proxy_read_timeout 120s;
# Les requetes de l'interface sont minuscules : un corps plus gros est suspect.
client_max_body_size 16k;
