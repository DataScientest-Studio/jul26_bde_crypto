# En-tetes de securite communs a toutes les reponses.
#
# Piege de nginx : un `add_header` dans un bloc location EFFACE ceux herites
# du niveau superieur. D'ou ce fichier, inclus explicitement partout.

# Le navigateur ne devine pas le type d'un fichier (un .js ne peut pas etre
# execute comme du HTML).
add_header X-Content-Type-Options "nosniff" always;
# La page ne peut pas etre affichee dans un cadre d'un autre site
# (clickjacking : un bouton invisible pose par-dessus le notre).
add_header X-Frame-Options "DENY" always;
# L'adresse de la page n'est jamais transmise aux sites externes.
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
