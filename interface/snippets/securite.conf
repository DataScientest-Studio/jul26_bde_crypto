include /etc/nginx/conf.d/snippets/entetes_communs.conf;

# Politique de contenu : la page ne charge et n'appelle QUE notre propre
# serveur. La bibliotheque de graphiques est livree avec le projet, pas
# chargee depuis un CDN : aucune dependance exterieure ne peut injecter du
# code. 'unsafe-inline' reste necessaire tant que le script de la page est
# ecrit dans le HTML lui-meme.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
