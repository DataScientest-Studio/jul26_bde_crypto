# =============================================================================
#  Integration continue de CryptoBot
#
#  A chaque envoi sur GitHub, cinq verifications independantes, puis la
#  construction des images :
#
#    qualite        analyse statique (ruff) : erreurs detectables sans executer
#    tests          tests unitaires (pytest) + couverture du code
#    dags           les DAG Airflow se chargent-ils, dans l'ordre prevu ?
#    configuration  regles d'alerte Prometheus et configuration nginx valides
#    deploiement    toute la pile demarree de zero, verifiee de l'exterieur
#        |
#    images         api, interface, airflow construites ; publiees sur le
#                   registre GitHub (ghcr.io) seulement depuis main, et
#                   seulement si TOUT le reste est vert.
#
#  Deploiement (CD) : sur la machine cible,
#      docker compose pull && docker compose up -d
#  recupere exactement les images testees ici, etiquetees du commit.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deux envois rapproches : inutile de tester le premier jusqu'au bout.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  qualite:
    name: Analyse statique (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.16.8
      - run: ruff check . --output-format=github

  tests:
    name: Tests unitaires (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-api.txt
      - name: Dependances de l'API et des tests
        run: pip install -r requirements-api.txt pytest pytest-cov pyyaml httpx
      - name: Tests (sans base de donnees ni modele reel)
        run: >
          pytest tests --ignore=tests/test_dags.py -q
          --cov=api --cov=scripts --cov=src --cov-report=term-missing:skip-covered
          --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: couverture
          path: coverage.xml

  dags:
    name: Integrite des DAG Airflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Airflow 3.3.2 (versions figees par le projet Airflow)
        run: >
          pip install "apache-airflow==3.3.2" apache-airflow-providers-postgres pytest
          --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.13.txt"
      - name: Chargement des DAG comme le fait Airflow
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: pytest tests/test_dags.py -v

  configuration:
    name: Regles d'alerte et proxy nginx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prometheus - configuration et regles d'alerte
        run: >
          docker run --rm -v "$PWD/monitoring/prometheus:/cfg:ro" --entrypoint promtool
          prom/prometheus:v3.13.3 check config /cfg/prometheus.yml
      - name: nginx - configuration de l'interface
        run: |
          docker build -t interface-test ./interface
          docker run --rm --add-host api:127.0.0.1 -e CRYPTOBOT_CLE_INTERFACE=test interface-test nginx -t

  deploiement:
    name: Deploiement de bout en bout
    runs-on: ubuntu-latest
    needs: [tests, configuration]
    env:
      # Produit + supervision. Airflow est verifie par le job "dags" : le
      # demarrer ici doublerait la duree du job sans rien prouver de plus.
      COMPOSE_PROFILES: supervision
    steps:
      - uses: actions/checkout@v7
      - name: Secrets aleatoires, propres a cette execution
        run: python3 scripts/generer_secrets.py
      - name: Demarrage de la pile
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Verification de l'exterieur
        run: |
          # Prometheus lit ses cibles toutes les 15 s : on lui laisse un tour.
          sleep 30
          python3 scripts/verifier_deploiement.py --profils supervision
      - name: Journaux en cas d'echec
        if: failure()
        run: docker compose logs --tail=80
      - name: Arret
        if: always()
        run: docker compose down -v

  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [qualite, tests, dags, configuration, deploiement]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            contexte: .
            fichier: Dockerfile.api
          - image: interface
            contexte: ./interface
            fichier: ./interface/Dockerfile
          - image: airflow
            contexte: .
            fichier: airflow/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Nom du registre (ghcr.io exige des minuscules)
        run: echo "REGISTRE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.contexte }}
          file: ${{ matrix.fichier }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRE }}/${{ matrix.image }}:latest
            ${{ env.REGISTRE }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
